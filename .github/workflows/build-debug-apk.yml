name: Build APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug and release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install required SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Write the signing key from secrets
        env:
          ANDROMI_KEYSTORE_B64: ${{ secrets.ANDROMI_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANDROMI_KEYSTORE_B64" ]; then
            echo "$ANDROMI_KEYSTORE_B64" | base64 -d > app/andromi.keystore
          else
            echo "::warning::Secret ANDROMI_KEYSTORE_B64 is missing: the APKs use a temporary key and will not update over each other"
          fi

      - name: Build debug and release APKs
        env:
          ANDROMI_KEY_PASSWORD: ${{ secrets.ANDROMI_KEY_PASSWORD }}
        run: ./gradlew :app:assembleGithubDebug :app:assembleGithubRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: andromi-auto-debug
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: andromi-auto-release
          path: app/build/outputs/apk/github/release/*.apk
          if-no-files-found: error
