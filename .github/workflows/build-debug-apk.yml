name: Build APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug and release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install required SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Write the signing key from secrets
        env:
          ANDROMI_KEYSTORE_B64: ${{ secrets.ANDROMI_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANDROMI_KEYSTORE_B64" ]; then
            echo "$ANDROMI_KEYSTORE_B64" | base64 -d > app/andromi.keystore
          else
            echo "::warning::Secret ANDROMI_KEYSTORE_B64 is missing: the APKs use a temporary key and will not update over each other"
          fi

      - name: Build debug and release APKs
        env:
          ANDROMI_KEY_PASSWORD: ${{ secrets.ANDROMI_KEY_PASSWORD }}
        run: ./gradlew :app:assembleGithubDebug :app:assembleGithubRelease --no-daemon --stacktrace

      - name: Name the APK files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/github/debug/*.apk dist/Andromi-Auto-debug.apk
          cp app/build/outputs/apk/github/release/*.apk dist/Andromi-Auto-release.apk

      - name: Remove the build files of older runs (they fill the storage quota)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[].id' | while read -r id; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" >/dev/null || true
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: andromi-auto-debug
          path: dist/Andromi-Auto-debug.apk
          retention-days: 7

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: andromi-auto-release
          path: dist/Andromi-Auto-release.apk
          retention-days: 7

      - name: Put the test build on the branch's test release page
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: test-${{ github.ref_name }}
        run: |
          NOTES="Test build ${{ github.run_number }} of branch ${{ github.ref_name }} (commit ${GITHUB_SHA::7}). Not a release: install Andromi-Auto-debug.apk to test."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Andromi-Auto-debug.apk dist/Andromi-Auto-release.apk --clobber
            gh release edit "$TAG" --notes "$NOTES" --prerelease --latest=false
          else
            gh release create "$TAG" dist/Andromi-Auto-debug.apk dist/Andromi-Auto-release.apk --target "$GITHUB_SHA" \
              --title "Test build ($TAG)" --prerelease --latest=false --notes "$NOTES"
          fi
